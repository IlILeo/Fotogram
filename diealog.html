<dialog class="dialog" id="dialog">
    <header>
        <h3 id="dialog-title"></h3>
        <button class="button-2" id="dialog-close" type="button">&times;</button>
    </header>
    <section>
        <img id="dialog-image" src="" alt="">
    </section>
    <footer>
        <button class="button-3" id="dialog-prev" type="button">&lt;</button>
        <p id="dialog-counter"></p>
        <button class="button-3" id="dialog-next" type="button">&gt;</button>
    </footer>
</dialog>
