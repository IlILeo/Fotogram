<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dialog.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html">
                <img src="./placeholder.icon.png" alt="Fotogram Logo">
            </a>
        </div>
        <h1>Fotogram</h1>
    </header>

    <main>
        <h2>My personal photo album</h2>
        <section class="gallery">
            <button onclick="openDialog('Dialog-1')">
                <img src="./placeholder.1.png" alt="Photo 1">
            </button>
            <button onclick="openDialog('Dialog-2')">
                <img src="./placeholder.2.png" alt="Photo 2">
            </button>
            <button onclick="openDialog('Dialog-3')">
                <img src="./placeholder.3.png" alt="Photo 3">
            </button>
            <button onclick="openDialog('Dialog-4')">
                <img src="./placeholder.4.png" alt="Photo 4">
            </button>
            <button onclick="openDialog('Dialog-5')">
                <img src="./placeholder.5.png" alt="Photo 5">
            </button>
        </section>
    </main>
    <footer>
        <img src="./da.logo.svg" alt="DA Logo">
        <p>&copy; 2023 Developer Academy GmBH</p>
    </footer>
    <script src="pic.js"></script>
</body>
</html>
